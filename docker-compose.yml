version: "3.8"

# ═══════════════════════════════════════════════════════════════════════
# MEWAH-KIP Docker Compose
# Mill: KIP — Microservice Architecture
# ═══════════════════════════════════════════════════════════════════════

networks:
  kip-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:

services:
  # ─────────────────────────────────────────────────────────────
  # INFRASTRUCTURE
  # ─────────────────────────────────────────────────────────────

  mysql:
    image: mysql:8.0
    container_name: kip-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_change_me}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./main-service/database/schema.sql:/docker-entrypoint-initdb.d/01_mewah_auth_config.sql:ro
      - ./plc-collector/database/schema.sql:/docker-entrypoint-initdb.d/02_mewah_plc.sql:ro
      - ./services/station-service/database/schema.sql:/docker-entrypoint-initdb.d/03_mewah_station.sql:ro
      - ./maintenance/database/schema.sql:/docker-entrypoint-initdb.d/04_mewah_maintenance.sql:ro
      - ./services/logsheet-service/database/schema.sql:/docker-entrypoint-initdb.d/05_mewah_logsheet.sql:ro
      - ./services/grading-service/database/schema.sql:/docker-entrypoint-initdb.d/06_mewah_grading.sql:ro
    networks:
      - kip-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kip-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_change_me}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - kip-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ─────────────────────────────────────────────────────────────
  # API GATEWAY
  # ─────────────────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    container_name: kip-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/ssl:/etc/nginx/ssl:ro
    depends_on:
      - main-service
      - realtime-service
      - station-service
      - maintenance-service
      - logsheet-service
      - grading-service
      - reporting-service
      - sterilizer
    networks:
      - kip-net

  # ─────────────────────────────────────────────────────────────
  # PLC COLLECTOR
  # ─────────────────────────────────────────────────────────────

  plc-collector:
    build: ./plc-collector
    container_name: kip-plc-collector
    restart: unless-stopped
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_change_me}@redis:6379
      REDIS_CHANNEL: kip:plc:data
      DB_HOST: mysql
      DB_USER: kip_snap7
      DB_PASSWORD: ${SNAP7_DB_PASSWORD:-snap7_change_me}
      DB_NAME: mewah_plc
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kip-net

  # ─────────────────────────────────────────────────────────────
  # BACKEND MICROSERVICES
  # ─────────────────────────────────────────────────────────────

  main-service:
    build: ./main-service/backend
    container_name: kip-main-service
    restart: unless-stopped
    ports:
      - "3001:3001"
      - "3008:3008"
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_USER_AUTH: kip_auth
      DB_PASSWORD_AUTH: ${AUTH_DB_PASSWORD:-auth_change_me}
      DB_NAME_AUTH: mewah_auth
      DB_USER_CONFIG: kip_config
      DB_PASSWORD_CONFIG: ${CONFIG_DB_PASSWORD:-config_change_me}
      DB_NAME_CONFIG: mewah_config
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_change_me}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-jwt_change_me_in_production}
      JWT_EXPIRES_IN: 7d
      NODE_ENV: ${NODE_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      kip-net:
        aliases:
          - auth-service
          - config-service

  realtime-service:
    build: ./services/realtime-service
    container_name: kip-realtime-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DB_HOST: mysql
      DB_USER: kip_realtime
      DB_PASSWORD: ${REALTIME_DB_PASSWORD:-realtime_change_me}
      DB_NAME: mewah_plc
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_change_me}@redis:6379
      REDIS_CHANNEL: kip:plc:data
      AUTH_SERVICE_URL: http://auth-service:3001
      JWT_SECRET: ${JWT_SECRET:-jwt_change_me_in_production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - kip-net

  station-service:
    build: ./services/station-service
    container_name: kip-station-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DB_HOST: mysql
      DB_USER: kip_station
      DB_PASSWORD: ${STATION_DB_PASSWORD:-station_change_me}
      DB_NAME: mewah_station
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_change_me}@redis:6379
      REDIS_CHANNEL: kip:plc:data
      CONFIG_SERVICE_URL: http://config-service:3008
      REALTIME_SERVICE_URL: http://realtime-service:3002
      AUTH_SERVICE_URL: http://auth-service:3001
      JWT_SECRET: ${JWT_SECRET:-jwt_change_me_in_production}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
