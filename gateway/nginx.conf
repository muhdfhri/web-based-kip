worker_processes auto;
events { worker_connections 1024; }

http {
  # ─────────────────────────────────────────────────
  # Upstream Services
  # ─────────────────────────────────────────────────
  upstream auth_service       { server main-service:3001; }
  upstream realtime_service   { server realtime-service:3002; }
  upstream station_service    { server station-service:3003; }
  upstream logsheet_service   { server logsheet-service:3005; }
  upstream grading_service    { server grading-service:3006; }
  upstream reporting_service  { server reporting-service:3007; }
  upstream config_service     { server main-service:3001; }

  # New Domain Services
  upstream maintenance_service{ server maintenance-service:3200; }
  upstream alarm_service       { server alarm-service:3300; }
  upstream contacts_service    { server contacts-service:3400; }

  # Station Services
  # upstream security_service    { server security-station:3101; }
  # upstream weighbridge_service { server weighbridge-station:3102; }
  # upstream grading_ramp_service{ server grading-ramp-station:3103; }
  # upstream loading_ramp_service{ server loading-ramp-station:3104; }
  upstream sterilizer_service  { server sterilizer-station:3105; }
  upstream threshing_service   { server threshing-station:3106; }
  # upstream efb_plant_service   { server efb-plant-station:3107; }
  upstream press_service       { server press-station:3108; }
  upstream kernel_plant_service{ server kernel-plant-station:3109; }
  # upstream oil_clarification_service{ server oil-clarification-station:3110; }
  upstream boiler_house_service{ server boiler-house-station:3111; }
  upstream engine_room_service { server engine-room-station:3112; }
  # upstream raw_water_treatment_service{ server raw-water-treatment-station:3113; }
  # upstream daf_osr_service     { server daf-osr-station:3114; }
  # upstream cmrs_service        { server cmrs-station:3115; }
  # upstream effluent_treatment_service{ server effluent-treatment-station:3116; }

  # ─────────────────────────────────────────────────
  # Rate Limiting
  # ─────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

  server {
    listen 80;
    server_name _;

    # ── Security Headers ──
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # ── WebSocket support for realtime-service ──
    map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      close;
    }

    # ─────────────────────────────────────────────────
    # AUTH SERVICE  →  /auth/*
    # ─────────────────────────────────────────────────
    location /auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass         http://auth_service/auth/;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─────────────────────────────────────────────────
    # USER MANAGEMENT  →  /api/admin/*
    # ─────────────────────────────────────────────────
    location /api/admin/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://auth_service/api/admin/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ─────────────────────────────────────────────────
    # ACTIVITY LOGS  →  /api/activity/*
    # ─────────────────────────────────────────────────
    location /api/activity/ {
      proxy_pass http://auth_service/api/activity/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ─────────────────────────────────────────────────
    # PLC REALTIME + CONFIG
    # /api/plc/* /api/plc-config/*
    # ─────────────────────────────────────────────────
    location /api/plc/ {
      limit_req zone=api burst=50 nodelay;
      proxy_pass http://realtime_service/api/plc/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/plc-config/ {
      proxy_pass http://realtime_service/api/plc-config/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ─────────────────────────────────────────────────
    # WEBSOCKET / SOCKET.IO  →  realtime-service
    # ─────────────────────────────────────────────────
    location /socket.io/ {
      proxy_pass         http://realtime_service/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection $connection_upgrade;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
    }

    # ─────────────────────────────────────────────────
    # STATION EVENTS & ALARM  →  /api/station/* /api/logsheet/* /api/settings/*
    # ─────────────────────────────────────────────────
    location /api/station/ {
      proxy_pass http://station_service/api/station/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/logsheet/ {
      proxy_pass http://station_service/api/logsheet/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/settings/ {
      proxy_pass http://station_service/api/settings/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ─────────────────────────────────────────────────
    # MAINTENANCE  →  /api/maintenance/*
    # ─────────────────────────────────────────────────
    location /api/maintenance/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://maintenance_service/api/maintenance/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      client_max_body_size 50M;
    }

    # ─────────────────────────────────────────────────
    # LOGSHEET FORM (Manual Input)  →  /api/logsheet-form/*
    # ─────────────────────────────────────────────────
    location /api/logsheet-form/ {
      proxy_pass http://logsheet_service/api/logsheet-form/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ─────────────────────────────────────────────────
    # GRADING AI  →  /api/grading/*
    # ─────────────────────────────────────────────────
    location /api/grading/ {
      proxy_pass http://grading_service/api/grading/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      client_max_body_size 20M;
    }

    # ─────────────────────────────────────────────────
    # REPORTING  →  /api/reports/*
    # ─────────────────────────────────────────────────
    location /api/reports/ {
      proxy_pass http://reporting_service/api/reports/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ─────────────────────────────────────────────────
    # SYSTEM CONFIG  →  /api/config/*
    # ─────────────────────────────────────────────────
    location /api/config/ {
      proxy_pass http://config_service/api/config/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ─────────────────────────────────────────────────
    # ALARM SERVICE  →  /api/alarm/*
    # ─────────────────────────────────────────────────
    location /api/alarm/ {
      proxy_pass http://alarm_service/api/alarm/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ─────────────────────────────────────────────────
    # CONTACTS SERVICE  →  /api/contacts/*
    # ─────────────────────────────────────────────────
    location /api/contacts/ {
      proxy_pass http://contacts_service/api/contacts/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ─────────────────────────────────────────────────
    # STATIONS  →  /api/{station}/*
    # ─────────────────────────────────────────────────
    # location /api/security/ {
    #   proxy_pass http://security_service/api/security/;
    #   proxy_http_version 1.1;
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Real-IP $remote_addr;
    # }
    # 
    # location /api/weighbridge/ {
    #   proxy_pass http://weighbridge_service/api/weighbridge/;
    #   proxy_http_version 1.1;
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Real-IP $remote_addr;
    # }
    # 
    # location /api/grading-ramp/ {
    #   proxy_pass http://grading_ramp_service/api/grading-ramp/;
    #   proxy_http_version 1.1;
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Real-IP $remote_addr;
    # }
    # 
    # location /api/loading-ramp/ {
    #   proxy_pass http://loading_ramp_service/api/loading-ramp/;
    #   proxy_http_version 1.1;
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Real-IP $remote_addr;
    # }

    location /api/sterilizer/ {
      proxy_pass http://sterilizer_service/api/sterilizer/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/threshing/ {
      proxy_pass http://threshing_service/api/threshing/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # location /api/efb-plant/ {
    #   proxy_pass http://efb_plant_service/api/efb-plant/;
    #   proxy_http_version 1.1;
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Real-IP $remote_addr;
    # }

    location /api/press/ {
      proxy_pass http://press_service/api/press/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/kernel-plant/ {
      proxy_pass http://kernel_plant_service/api/kernel-plant/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # location /api/oil-clarification/ {
    #   proxy_pass http://oil_clarification_service/api/oil-clarification/;
    #   proxy_http_version 1.1;
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Real-IP $remote_addr;
    # }

    location /api/boiler-house/ {
      proxy_pass http://boiler_house_service/api/boiler-house/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/engine-room/ {
      proxy_pass http://engine_room_service/api/engine-room/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # location /api/raw-water-treatment/ {
    #   proxy_pass http://raw_water_treatment_service/api/raw-water-treatment/;
    #   proxy_http_version 1.1;
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Real-IP $remote_addr;
    # }
    # 
    # location /api/daf-osr/ {
    #   proxy_pass http://daf_osr_service/api/daf-osr/;
    #   proxy_http_version 1.1;
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Real-IP $remote_addr;
    # }
    # 
    # location /api/cmrs/ {
    #   proxy_pass http://cmrs_service/api/cmrs/;
    #   proxy_http_version 1.1;
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Real-IP $remote_addr;
    # }
    # 
    # location /api/effluent-treatment/ {
    #   proxy_pass http://effluent_treatment_service/api/effluent-treatment/;
    #   proxy_http_version 1.1;
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Real-IP $remote_addr;
    # }

    # ─────────────────────────────────────────────────
    # HEALTH CHECK
    # ─────────────────────────────────────────────────
    location /health {
      return 200 '{"status":"gateway_ok","mill":"KIP"}';
      add_header Content-Type application/json;
    }
  }
}
